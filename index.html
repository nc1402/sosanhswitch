<html lang="vi"><head><meta charset="utf-8">

<style>
:root{--ink:#12262B;--teal:#0F7B83;--bg:#EEF3F2;--card:#fff;--line:#D5DFDD;--mute:#5F7479;--amber:#FFF3D6;--amberd:#C98A00}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 20px 14px;position:sticky;top:0;z-index:5}
.top{display:flex;gap:8px 24px;align-items:center;flex-wrap:wrap;max-width:1280px;margin:0 auto}
h1{margin:0;font-size:20px}header small{color:#A9C2C4;display:block}
.sb{flex:1;min-width:260px}.dsc{display:flex;gap:6px;align-items:center;font-size:13px;color:#DCEBEC;cursor:pointer;margin-top:6px}
.links{display:flex;flex-direction:column;gap:6px;margin-left:auto}.links a{color:#fff;border:1px solid #6C8D91;border-radius:6px;padding:5px 12px;font-size:13px;text-decoration:none;text-align:center;white-space:nowrap}.links a:hover{background:#1E3C42}
.dis{background:#D93025;color:#fff;border-radius:4px;font-size:11px;font-weight:600;padding:1px 6px;white-space:nowrap}#q{width:100%;padding:10px 12px;border:0;border-radius:6px;font:inherit}
main{display:grid;grid-template-columns:290px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px}
aside{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;align-self:start;position:sticky;top:112px;max-height:calc(100vh - 130px);overflow:auto}
button{font:inherit;cursor:pointer}.link{background:none;border:0;color:var(--teal);padding:0;text-decoration:underline}
select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff}
.rg{margin:0 0 12px;font-size:13px}.rg>div{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}.rg>div b{color:var(--ink)}.rg input{width:100%;margin:2px 0;accent-color:var(--teal)}.rg small{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.rg>.rgr{display:flex;justify-content:flex-start;align-items:center;gap:10px}.rg .rgr input[type=range]{flex:1;min-width:0}
.pc{display:flex;flex-direction:column;flex:none}.rg .pc .ck{padding:0;font-size:12px;white-space:nowrap;color:var(--ink)}.rg .pc input{width:auto;margin:0}
details.fg{border-bottom:1px solid var(--line)}details.fg summary{cursor:pointer;font-weight:700;font-size:14px;padding:9px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fg summary::-webkit-details-marker{display:none}details.fg summary::after{content:"+";color:var(--mute)}details.fg[open] summary::after{content:"–"}
.n{background:var(--teal);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;margin-left:6px}
.fl{border:0;margin:0 0 10px;padding:0;min-width:0;font-size:13px}.fl legend,.fl>label{font-size:12px;color:var(--mute);padding:0;display:block;margin-bottom:2px}
.ck{display:flex;gap:7px;align-items:center;padding:2px 0;cursor:pointer;font-size:13px}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.bar2 p{margin:0;color:var(--mute)}
.bar2 label{display:flex;gap:8px;align-items:center;font-size:14px}.bar2 select{width:auto}
#act{display:flex;gap:6px;flex-wrap:wrap}#act:not(:empty){margin-bottom:12px}
.ac{background:#D6ECEC;border:0;border-radius:12px;padding:3px 10px;font-size:12px;color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--tc,#5D7380);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:9px}
.card.sel{outline:2px solid var(--teal)}
.card h3{margin:0;font-size:19px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-align:left}.mn:hover{color:var(--teal);text-decoration:underline}
.gen{color:#fff;background:var(--tc,#5D7380);border-radius:4px;font-size:12px;font-weight:600;padding:1px 7px}
.tags,.chips{display:flex;flex-wrap:wrap;gap:4px}.tags span,.chips span{background:#E6EEEE;border-radius:10px;padding:1px 9px;font-size:12px}
.chips span.on{background:#D6ECEC;font-weight:700;box-shadow:inset 0 0 0 1px var(--teal)}.chips span.m{background:none;color:var(--mute)}
.kvs{display:flex;flex-direction:column;gap:3px}.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:13px}.kv>span{color:var(--mute)}.kv>b{text-align:right}

.hit{font-size:12px;background:var(--amber);border-radius:4px;padding:3px 8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}.foot label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.more{background:none;border:0;color:var(--teal);font-weight:700;font-size:13px;padding:0}
.empty{padding:30px;text-align:center;color:var(--mute);background:var(--card);border-radius:8px;grid-column:1/-1}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0));display:none;align-items:center;gap:14px;z-index:6}

.tw{overflow:auto;flex:1;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:140px;text-align:left;overflow-wrap:anywhere}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:170px;font-weight:700;z-index:1}
thead th{position:sticky;top:0;background:var(--ink);color:#fff;z-index:2}thead th:first-child{background:var(--ink);z-index:3}
tr.g td{background:var(--bg);font-weight:700}tr.diff td{background:var(--amber)}tr.diff td:first-child{box-shadow:inset 4px 0 var(--amberd)}
.na{color:#93A3A6}#db td:first-child{position:static;width:38%}
footer{max-width:1280px;margin:0 auto;padding:0 20px 90px;color:var(--mute);font-size:12px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px}.links{flex-direction:row;width:100%;margin-left:0}.links a{flex:1;white-space:normal;font-size:12px;padding:6px 8px;display:flex;align-items:center;justify-content:center}aside{position:static;max-height:none}header{position:static}}

 &&Object.entries(s.ch).every(([j,v])=>ROWS[j].vals[i]===v)
 &&s.pw.every(([j,pr])=>{const m=Math.max(1,s.n[j]||0);return(numOf(ROWS[j].vals[i])||0)>=m&&pr.reduce((a,k)=>a+(numOf(ROWS[k].vals[i])||0),0)>=m})
 &&s.b.every(j=>has(ROWS[j].vals[i]))&&s.p.every(j=>/poe/i.test(ROWS[j].vals[i]))&&s.g.every(j=>(numOf(ROWS[j].vals[i])??0)>0)&&s.h.every(l=>l.split(',').some(j=>has(ROWS[j].vals[i])));
const bmax={};const barMax=k=>bmax[k]??(bmax[k]=Math.max(1,...M.map((m,i)=>val(V(k,i))||0)));
const specH=(p,i)=>{
 const kv=(l,v,x='')=>`<div class="kv"><span>${esc(l)}</span><b>${v}</b></div>${x}`;
 if(Array.isArray(p)){if(ri(p[0])<0)return'';const v=V(p[0],i);return kv(p[1],esc(has(v)?(p[2]&&numOf(v)?v+' '+p[2]:v):'–'))}
 if(p.kind==='ports'){const t=p.rows.map(([k,l])=>{const n=numOf(V(k,i));return n>0?`<div>${n} × ${esc(l)}</div>`:''}).join('');return kv(p.label,t||'<span class="na">–</span>')}
 if(p.kind==='poe'){const t=p.rows.map(([k,l])=>{const n=numOf(V(k,i));return n>0?`${esc(l)} ×${n}`:''}).filter(Boolean).join(' · '),b=numOf(V(p.budget,i))||0;
  return kv(p.label,(t||b>0)?`<div>${t||'PoE'}</div>${b>0?`<div>Tổng ${b} ${esc(p.unit||'W')}</div>`:''}`:'<span class="na">Không PoE</span>')}
 if(p.kind==='bar'){if(ri(p.row)<0)return'';const v=V(p.row,i),n=val(v);
  return kv(p.label,esc(has(v)?(p.unit&&numOf(v)?v+' '+p.unit:v):'–'),n>0?`<div class="track"><i style="width:${Math.max(4,n/barMax(p.row)*100)}%"></i></div>`:'')}
 return''};
let ACT=[];
function render(){
 const q=$('#q').value,s=state(),sk=$('#sort').value;
 const sd=$('#disc').checked,list=M.map((m,i)=>i).filter(i=>(sd||!DISC[i])&&ok(i,s)&&matchQ(i,q));
 if(sk){const j=ri(sk);list.sort((a,b)=>(val(ROWS[j].vals[b])??-1)-(val(ROWS[j].vals[a])??-1)||a-b)}
 shown=list;$('#count').textContent=`${list.length}/${N} thiết bị phù hợp`;
 ACT=[];
 Object.entries(s.c).forEach(([j,set])=>set.forEach(v=>ACT.push([v,()=>$$(`[data-c="${j}"]`).find(e=>e.value===v).checked=false])));
 Object.entries(s.ch).forEach(([j,v])=>{const e=$(`[data-ch="${j}"]`);ACT.push([`${e.dataset.l}: ${v}`,()=>e.value='0'])});
 Object.keys(s.n).forEach(j=>{const e=$(`#n${j}`),lb=(e.closest('.rg')?.querySelector('label')||{}).textContent||ROWS[j].label;ACT.push([`${lb} ≥ ${JSON.parse(e.dataset.t)[e.value-1]}`,()=>e.value=0])});
 $$('input[type=range]').forEach(e=>{$('#sv'+e.dataset.n).textContent=+e.value?'từ '+JSON.parse(e.dataset.t)[e.value-1]:'Bất kỳ'});
 $$('[data-pw]:checked').forEach(e=>ACT.push([e.dataset.l,()=>e.checked=false]));
 s.b.forEach(j=>ACT.push([ROWS[j].label,()=>$(`[data-b="${j}"]`).checked=false]));
 [['p',s.p],['g',s.g],['h',s.h]].forEach(([k,a])=>a.forEach(j=>{const e=$(`[data-${k}="${j}"]`);ACT.push([e.dataset.l,()=>e.checked=false])}));
 $('#act').innerHTML=ACT.map((a,k)=>`<button class="ac" data-a="${k}">${esc(a[0])} ✕</button>`).join('');
 $$('details.fg').forEach(d=>{const n=d.querySelectorAll('[data-c]:checked,[data-b]:checked,[data-p]:checked,[data-g]:checked,[data-h]:checked,[data-pw]:checked').length+[...d.querySelectorAll('[data-n]')].filter(e=>+e.value).length+[...d.querySelectorAll('[data-ch]')].filter(e=>e.value!=='0').length,b=d.querySelector('.n');b.hidden=!n;b.textContent=n});
 const bset=new Set(s.b),CM=C.chips_max||0;
 $('#grid').innerHTML=list.length?list.map(i=>{
  const tg=C.tags.map(t=>V(t,i)).filter(Boolean),ty=tg[0]||'',tc=(C.type_colors||{})[ty]||'';
  const hl=q.trim()?hits(i,q).map(r=>`<div class="hit">Khớp: <b>${esc(r.label)}</b> — ${esc(r.vals[i].slice(0,60))}</div>`).join(''):'';
  const fe=CM?ROWS.map((r,j)=>[r,j]).filter(([r,j])=>r.k==='bool'&&has(r.vals[i])).sort((a,b)=>bset.has(String(b[1]))-bset.has(String(a[1]))):[];
  const ch=fe.slice(0,CM).map(([r,j])=>`<span class="${bset.has(String(j))?'on':''}">${esc(r.label)}</span>`).join('')+(fe.length>CM?`<span class="m">+${fe.length-CM}</span>`:'');
  return `<article class="card${sel.has(i)?' sel':''}"${tc?` style="--tc:${esc(tc)}"`:''}><h3><button class="mn" data-d="${i}">${esc(MN[i])}</button>${DISC[i]?'<span class="dis">Ngừng SX</span>':''}${ty?`<span class="gen">${esc(ty)}</span>`:''}</h3>
  ${tg.length>1?`<div class="tags">${tg.slice(1).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
  <div class="kvs">${C.specs.map(p=>specH(p,i)).join('')}</div>${hl}
  ${ch?`<div class="chips">${ch}</div>`:''}
  <div class="foot"><label><input type="checkbox" data-s="${i}"${sel.has(i)?' checked':''}> Chọn để so sánh</label><button class="more" data-d="${i}">Xem chi tiết ›</button></div></article>`}).join(''):'<div class="empty">Không có thiết bị nào khớp. <button class="link" id="r2">Xoá bộ lọc</button></div>';
 $('#bar').classList.toggle('on',sel.size>0);$('#bn').textContent=`Đã chọn ${sel.size}/${MAXSEL} thiết bị`;$('#go').disabled=sel.size<2;
}
const cellH=(v,m)=>v?esc(v):'<span class="na">chưa có dữ liệu</span>';
function compare(){const ix=[...sel].sort((a,b)=>a-b),only=$('#only').checked;
 let h=`<table><thead><tr><th>Thông số</th>${ix.map(i=>`<th>${nm(i)}</th>`).join('')}</tr></thead><tbody>`;
 D.groups.forEach(g=>{let b='';g.rows.forEach(r=>{const v=ix.map(i=>r.vals[i]||''),d=new Set(v.map(x=>x.toLowerCase())).size>1;if(only&&!d)return;
  b+=`<tr class="${d?'diff':''}"><td>${esc(r.label)}</td>${v.map(x=>`<td>${cellH(x)}</td>`).join('')}</tr>`});
  if(b)h+=`<tr class="g"><td colspan="${ix.length+1}">${esc(gt(g.title))}</td></tr>`+b});
 $('#tw').innerHTML=h+'</tbody></table>'}
function detail(i){cd=i;const hide=$('#dhide').checked,p=shown.indexOf(i);
 $('#dt').innerHTML=nm(i);$('#dp').disabled=p<1;$('#dn').disabled=p<0||p>=shown.length-1;
 let h='<table><tbody>';D.groups.forEach(g=>{let b='';g.rows.forEach(r=>{const v=r.vals[i];if(hide&&!has(v))return;b+=`<tr><td>${esc(r.label)}</td><td>${cellH(v)}</td></tr>`});
  if(b)h+=`<tr class="g"><td colspan="2">${esc(gt(g.title))}</td></tr>`+b});
 $('#db').innerHTML=h+'</tbody></table>'}
const openD=i=>{detail(i);if(!$('#dd').open)$('#dd').showModal()};
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.s!==undefined)return;if(t.id==='dhide')return detail(cd);if(t.id==='only')return compare();render()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.a)return(ACT[t.dataset.a][1](),render());if(t.dataset.d!==undefined)return openD(+t.dataset.d);
 if(t.dataset.close!==undefined)return t.closest('dialog').close();if(t.dataset.print!==undefined)return window.print();
 if(t.id==='r2')$('#reset').click()});
$('#grid').addEventListener('change',e=>{const i=e.target.dataset.s;if(i===undefined)return;
 if(e.target.checked){if(sel.size>=MAXSEL){e.target.checked=false;alert(`Chọn tối đa ${MAXSEL} thiết bị để so sánh.`);return}sel.add(+i)}else sel.delete(+i);render()});
$('#go').onclick=()=>{compare();$('#dlg').showModal()};$('#clr').onclick=()=>{sel.clear();render()};
$('#dp').onclick=()=>openD(shown[shown.indexOf(cd)-1]);$('#dn').onclick=()=>openD(shown[shown.indexOf(cd)+1]);
$('#reset').onclick=()=>{$('#q').value='';$$('aside input[type=checkbox]').forEach(e=>e.checked=false);$$('aside select,aside input[type=range]').forEach(e=>e.value=0);$('#sort').value='';$('#disc').checked=false;render()};
render();
</script></body></html>
